name: couple_privat_app
description: "Aplikasi Couple Privat (Web & Mobile) - Eksklusif 2 Pengguna dengan Fitur Chat, Video Call WebRTC, Watch Party, Galeri Kenangan, dan Mini Game."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing & State Management
  go_router: ^14.0.0
  provider: ^6.1.2

  # Firebase Services (BaaS Tier - SRS Bab 6.2 & 6.3)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.0
  firebase_storage: ^12.0.0

  # Real-Time Audio-Visual Communication (SRS Bab 6.4)
  flutter_webrtc: ^0.11.0

  # Local Persistence & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Video Playback (Watch Party - SRS Bab 3 FR-WTP-01)
  video_player: ^2.8.6
  youtube_player_flutter: ^9.0.1

  # UI & Micro-interactions
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
